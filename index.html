<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statement Parser — WorkSmart</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --border2: #383838;
    --accent: #c5f135;
    --accent-dim: rgba(197,241,53,0.12);
    --accent-hover: rgba(197,241,53,0.18);
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --green: #4ade80;
    --red: #f87171;
    --green-dim: rgba(74,222,128,0.1);
    --red-dim: rgba(248,113,113,0.1);
    --radius: 10px;
    --radius-lg: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .logo span { color: var(--accent); }
  .header-tag {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* LAYOUT */
  main { max-width: 1200px; margin: 0 auto; padding: 32px 32px 64px; }

  /* UPLOAD ZONE */
  #upload-section { margin-bottom: 32px; }
  .upload-zone {
    border: 1.5px dashed var(--border2);
    border-radius: var(--radius-lg);
    padding: 56px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .upload-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(197,241,53,0.04) 0%, transparent 70%);
    pointer-events: none;
  }
  .upload-zone:hover, .upload-zone.drag {
    border-color: var(--accent);
    background: var(--surface2);
  }
  .upload-icon {
    width: 52px; height: 52px;
    border: 1.5px solid var(--border2);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 22px;
    background: var(--surface2);
    transition: all 0.2s;
  }
  .upload-zone:hover .upload-icon { border-color: var(--accent); color: var(--accent); }
  .upload-title { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .upload-sub { color: var(--text2); font-size: 12px; }
  .upload-sub strong { color: var(--accent); font-weight: 500; }

  /* LOADING */
  #loading {
    display: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 48px;
    text-align: center;
    background: var(--surface);
    margin-bottom: 32px;
  }
  .pulse-ring {
    width: 48px; height: 48px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-label { color: var(--text2); font-size: 13px; }
  .loading-label span { color: var(--accent); }

  /* STATS */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
    animation: fadeUp 0.4s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: none; } }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
  }
  .stat-card.accent-card { border-color: rgba(197,241,53,0.25); background: var(--accent-dim); }
  .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .stat-val { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; }
  .stat-val.credit { color: var(--green); }
  .stat-val.debit { color: var(--red); }
  .stat-val.accent { color: var(--accent); }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
    animation: fadeUp 0.4s 0.1s ease both;
  }
  .toolbar-left { display: flex; gap: 10px; flex: 1; flex-wrap: wrap; }
  .toolbar-right { display: flex; gap: 8px; }
  input[type=text], select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus, select:focus { border-color: var(--border2); }
  input[type=text] { min-width: 220px; }
  select { cursor: pointer; }
  select option { background: #1e1e1e; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
  .btn.primary { background: var(--accent); color: #000; border-color: transparent; font-weight: 700; }
  .btn.primary:hover { background: #d4f54a; }
  .btn.danger { color: var(--red); border-color: rgba(248,113,113,0.25); }
  .btn.danger:hover { background: var(--red-dim); }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* TABLE */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    animation: fadeUp 0.4s 0.15s ease both;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--surface2); }
  th {
    padding: 11px 16px;
    text-align: left;
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 220px;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover td { background: var(--surface2); }
  .amount-credit { color: var(--green); }
  .amount-debit { color: var(--red); }

  .cat-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
    white-space: nowrap;
  }

  .actions-cell { display: flex; gap: 6px; }
  .icon-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    color: var(--text3);
    transition: all 0.15s;
    font-size: 13px;
  }
  .icon-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
  .icon-btn.del:hover { border-color: rgba(248,113,113,0.3); color: var(--red); background: var(--red-dim); }
  .icon-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .empty-state { padding: 48px; text-align: center; color: var(--text3); }
  .empty-state .big { font-size: 28px; margin-bottom: 10px; }

  /* PAGINATION */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text3);
  }
  .pag-btns { display: flex; gap: 6px; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 28px;
    width: 400px;
    max-width: 95vw;
    animation: popIn 0.2s ease;
  }
  @keyframes popIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: none; } }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .modal-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px; }
  .modal-close:hover { color: var(--text); }
  .form-field { margin-bottom: 14px; }
  .form-label { display: block; font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .form-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* FILE BADGE */
  .file-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--accent-dim);
    border: 1px solid rgba(197,241,53,0.2);
    border-radius: 20px;
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 20px;
  }

  #data-section { display: none; }

  @media (max-width: 700px) {
    main { padding: 16px; }
    header { padding: 14px 16px; }
    .stats-row { grid-template-columns: repeat(2,1fr); }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-right { flex-wrap: wrap; }
    input[type=text] { min-width: unset; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Work<span>Smart</span> <span style="color:var(--text3);font-weight:400;font-size:14px">/ Statement Parser</span></div>
  <div class="header-tag">AI-Powered · PDF → CSV</div>
</header>

<main>

  <!-- UPLOAD -->
  <div id="upload-section">
    <div class="upload-zone" id="dropzone"
      onclick="document.getElementById('fileinput').click()"
      ondragover="onDrag(event,true)"
      ondragleave="onDrag(event,false)"
      ondrop="onDrop(event)">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/>
          <line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,12 15,15"/>
        </svg>
      </div>
      <div class="upload-title">Drop your bank statement PDF</div>
      <div class="upload-sub" style="margin-top:6px">Drag &amp; drop or <strong>click to browse</strong> — text-based PDF required</div>
    </div>
    <input type="file" id="fileinput" accept=".pdf" style="display:none" onchange="handleFile(this.files[0])">
  </div>

  <!-- LOADING -->
  <div id="loading">
    <div class="pulse-ring"></div>
    <div class="loading-label">Parsing transactions with <span>AI</span>…</div>
    <div style="color:var(--text3);font-size:11px;margin-top:8px">This may take 10–20 seconds depending on statement length</div>
  </div>

  <!-- DATA SECTION -->
  <div id="data-section">

    <div id="file-badge-wrap"></div>

    <!-- STATS -->
    <div class="stats-row" id="stats-row"></div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="search" placeholder="Search description, date, amount…" oninput="filterRows()">
        <select id="typeFilter" onchange="filterRows()">
          <option value="">All transactions</option>
          <option value="credit">Credits only</option>
          <option value="debit">Debits only</option>
        </select>
        <select id="catFilter" onchange="filterRows()">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="toolbar-right">
        <button class="btn" onclick="openAdd()">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add row
        </button>
        <button class="btn primary" onclick="exportCSV()">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
        <button class="btn" onclick="resetAll()">
          <svg viewBox="0 0 24 24"><polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 1 0 .49-3.85"/></svg>
          New file
        </button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:110px">Date</th>
              <th>Description</th>
              <th style="width:120px">Category</th>
              <th style="width:110px;text-align:right">Amount</th>
              <th style="width:80px;text-align:center">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Add Transaction</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-field">
      <label class="form-label">Date</label>
      <input class="form-input" type="text" id="m-date" placeholder="2024-01-15">
    </div>
    <div class="form-field">
      <label class="form-label">Description</label>
      <input class="form-input" type="text" id="m-desc" placeholder="Payee / narrative">
    </div>
    <div class="form-field">
      <label class="form-label">Category</label>
      <select class="form-input" id="m-cat">
        <option>Groceries</option><option>Utilities</option><option>Salary</option>
        <option>Transfer</option><option>Entertainment</option><option>Transport</option>
        <option>Healthcare</option><option>Insurance</option><option>Other</option>
      </select>
    </div>
    <div class="form-field">
      <label class="form-label">Amount (positive = credit, negative = debit)</label>
      <input class="form-input" type="number" id="m-amt" step="0.01" placeholder="-250.00">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveModal()">Save Transaction</button>
    </div>
  </div>
</div>

<script>
  const CATS = ['Groceries','Utilities','Salary','Transfer','Entertainment','Transport','Healthcare','Insurance','Other'];
  let allRows = [], filtered = [], page = 0, modalMode = 'add', editId = null;
  const PAGE_SIZE = 25;

  /* ── DRAG & DROP ── */
  function onDrag(e, on) {
    e.preventDefault();
    document.getElementById('dropzone').classList.toggle('drag', on);
  }
  function onDrop(e) {
    e.preventDefault();
    onDrag(e, false);
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  }

  /* ── FILE HANDLING ── */
  async function handleFile(file) {
    if (!file || file.type !== 'application/pdf') {
      alert('Please upload a PDF file.');
      return;
    }
    const reader = new FileReader();
    reader.onload = async (ev) => {
      document.getElementById('upload-section').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      const b64 = ev.target.result.split(',')[1];
      try {
        const rows = await parseWithClaude(b64);
        allRows = rows.map((r, i) => ({ ...r, id: Date.now() + i }));
        populateCatFilter();
        filterRows();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('data-section').style.display = 'block';
        document.getElementById('file-badge-wrap').innerHTML =
          `<div class="file-badge">
            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
            ${file.name} &nbsp;·&nbsp; ${allRows.length} transactions found
          </div>`;
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('upload-section').style.display = 'block';
        alert('Could not parse the PDF.\n\n' + err.message);
      }
    };
    reader.readAsDataURL(file);
  }

  /* ── CLAUDE API ── */
  async function parseWithClaude(b64) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        system: `You are a bank statement parser. Extract ALL transactions from the PDF.
Return ONLY a valid JSON array — no markdown, no backticks, no explanation.
Each object must have:
- date: string (YYYY-MM-DD or original format)
- description: string (payee/narrative, keep concise)
- category: one of [Groceries, Utilities, Salary, Transfer, Entertainment, Transport, Healthcare, Insurance, Other]
- amount: number (positive for credits/deposits, negative for debits/payments)
Categorise intelligently from the description. If no transactions found, return [].`,
        messages: [{
          role: 'user',
          content: [
            { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: b64 } },
            { type: 'text', text: 'Extract all transactions. Return only a JSON array.' }
          ]
        }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || 'API error');
    const raw = (data.content || []).map(c => c.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    let parsed;
    try { parsed = JSON.parse(clean); }
    catch {
      const m = clean.match(/\[[\s\S]*\]/);
      if (m) parsed = JSON.parse(m[0]);
      else throw new Error('Could not parse AI response as JSON.');
    }
    if (!Array.isArray(parsed)) throw new Error('Unexpected response format.');
    return parsed;
  }

  /* ── FILTER & RENDER ── */
  function filterRows() {
    const q = (document.getElementById('search')?.value || '').toLowerCase();
    const t = document.getElementById('typeFilter')?.value || '';
    const c = document.getElementById('catFilter')?.value || '';
    filtered = allRows.filter(r => {
      const mq = !q || (r.description || '').toLowerCase().includes(q) || (r.date || '').includes(q) || String(Math.abs(r.amount || 0)).includes(q);
      const mt = !t || (t === 'credit' ? r.amount >= 0 : r.amount < 0);
      const mc = !c || r.category === c;
      return mq && mt && mc;
    });
    page = 0;
    renderStats();
    renderTable();
    renderPagination();
  }

  function renderStats() {
    const src = filtered.length || !document.getElementById('search')?.value ? filtered : allRows;
    const display = allRows;
    const credits = display.filter(r => r.amount >= 0).reduce((s, r) => s + r.amount, 0);
    const debits = display.filter(r => r.amount < 0).reduce((s, r) => s + r.amount, 0);
    const net = credits + debits;
    document.getElementById('stats-row').innerHTML = `
      <div class="stat-card accent-card">
        <div class="stat-label">Transactions</div>
        <div class="stat-val accent">${display.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Credits</div>
        <div class="stat-val credit">+${fmtAmt(credits)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Debits</div>
        <div class="stat-val debit">${fmtAmt(debits)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Net Balance</div>
        <div class="stat-val ${net >= 0 ? 'credit' : 'debit'}">${net >= 0 ? '+' : ''}${fmtAmt(net)}</div>
      </div>`;
  }

  function renderTable() {
    const tbody = document.getElementById('tbody');
    const slice = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
    if (!slice.length) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="big">◎</div>No transactions found</div></td></tr>`;
      return;
    }
    tbody.innerHTML = slice.map(r => `
      <tr>
        <td>${esc(r.date || '—')}</td>
        <td title="${esc(r.description)}">${esc(r.description || '—')}</td>
        <td><span class="cat-badge">${esc(r.category || 'Other')}</span></td>
        <td class="${r.amount >= 0 ? 'amount-credit' : 'amount-debit'}" style="text-align:right;font-variant-numeric:tabular-nums">
          ${r.amount >= 0 ? '+' : ''}${fmtAmt(r.amount)}
        </td>
        <td>
          <div class="actions-cell" style="justify-content:center">
            <button class="icon-btn" onclick="openEdit(${r.id})" title="Edit">
              <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="icon-btn del" onclick="deleteRow(${r.id})" title="Delete">
              <svg viewBox="0 0 24 24"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </td>
      </tr>`).join('');
  }

  function renderPagination() {
    const total = filtered.length;
    const pages = Math.ceil(total / PAGE_SIZE);
    const el = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = `<span>${total} row${total !== 1 ? 's' : ''}</span><span></span>`; return; }
    el.innerHTML = `
      <span>Showing ${page * PAGE_SIZE + 1}–${Math.min((page + 1) * PAGE_SIZE, total)} of ${total}</span>
      <div class="pag-btns">
        <button class="btn" onclick="goPage(${page - 1})" ${page === 0 ? 'disabled style="opacity:0.35"' : ''} style="padding:5px 10px">←</button>
        <button class="btn" onclick="goPage(${page + 1})" ${page >= pages - 1 ? 'disabled style="opacity:0.35"' : ''} style="padding:5px 10px">→</button>
      </div>`;
  }

  function goPage(n) { page = n; renderTable(); renderPagination(); }

  function populateCatFilter() {
    const cats = [...new Set(allRows.map(r => r.category).filter(Boolean))].sort();
    const sel = document.getElementById('catFilter');
    sel.innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option>${c}</option>`).join('');
  }

  /* ── CRUD ── */
  function openAdd() {
    modalMode = 'add'; editId = null;
    document.getElementById('modal-title').textContent = 'Add Transaction';
    ['m-date', 'm-desc', 'm-amt'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('m-cat').value = 'Other';
    document.getElementById('modal').classList.add('open');
    document.getElementById('m-date').focus();
  }

  function openEdit(id) {
    const r = allRows.find(x => x.id === id);
    if (!r) return;
    modalMode = 'edit'; editId = id;
    document.getElementById('modal-title').textContent = 'Edit Transaction';
    document.getElementById('m-date').value = r.date || '';
    document.getElementById('m-desc').value = r.description || '';
    document.getElementById('m-cat').value = r.category || 'Other';
    document.getElementById('m-amt').value = r.amount;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  function saveModal() {
    const date = document.getElementById('m-date').value.trim();
    const description = document.getElementById('m-desc').value.trim();
    const category = document.getElementById('m-cat').value;
    const amount = parseFloat(document.getElementById('m-amt').value);
    if (!date || !description || isNaN(amount)) { alert('Please fill in all fields.'); return; }
    if (modalMode === 'add') {
      allRows.unshift({ id: Date.now(), date, description, category, amount });
    } else {
      const r = allRows.find(x => x.id === editId);
      if (r) Object.assign(r, { date, description, category, amount });
    }
    closeModal();
    populateCatFilter();
    filterRows();
  }

  function deleteRow(id) {
    if (!confirm('Delete this transaction?')) return;
    allRows = allRows.filter(r => r.id !== id);
    filterRows();
  }

  /* ── EXPORT ── */
  function exportCSV() {
    const rows = filtered.length ? filtered : allRows;
    const lines = ['Date,Description,Category,Amount'];
    rows.forEach(r => lines.push(`${q(r.date)},${q(r.description)},${q(r.category)},${r.amount}`));
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bank_statement.csv';
    a.click();
  }

  function resetAll() {
    allRows = []; filtered = [];
    document.getElementById('data-section').style.display = 'none';
    document.getElementById('upload-section').style.display = 'block';
    document.getElementById('fileinput').value = '';
    document.getElementById('file-badge-wrap').innerHTML = '';
  }

  /* ── UTILS ── */
  function fmtAmt(n) {
    return Math.abs(n).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function q(s) { return '"' + String(s || '').replace(/"/g, '""') + '"'; }
</script>
</body>
</html>
